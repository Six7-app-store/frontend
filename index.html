<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/based-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Six7 Click'n'Deploy</title>
    <!-- Applies the saved theme before first paint (no flash). Light is the
         default regardless of the OS setting. Key shared with useTheme.ts. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {}
      })()
    </script>
    <!-- Applies the accent colour an admin chose, cached from the last visit,
         so the built-in red does not flash first. Key and id shared with
         useBranding.ts and storage-keys.ts. -->
    <script>
      (function () {
        try {
          var css = localStorage.getItem('ui-accent-css')
          if (css) {
            var style = document.createElement('style')
            style.id = 'ui-accent'
            style.textContent = css
            document.head.appendChild(style)
          }
        } catch (e) {}
      })()
    </script>
    <script src="/env-config.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
